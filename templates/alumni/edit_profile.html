{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar">
        <h3 class="sidebar-title">Alumni Menu</h3>
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('alumni.dashboard') }}">📊 Dashboard</a></li>
            <li><a href="{{ url_for('alumni.edit_profile') }}" class="active">👤 Edit Profile</a></li>
            <li><a href="{{ url_for('alumni.my_jobs') }}">💼 My Jobs</a></li>
            <li><a href="{{ url_for('alumni.add_job') }}">➕ Post a Job</a></li>
            <li><a href="{{ url_for('alumni.mentorship_requests') }}">🤝 Mentorship Requests</a></li>
            <li><a href="{{ url_for('auth.logout') }}" class="logout-link">🚪 Logout</a></li>
        </ul>
    </aside>
    <div class="dashboard-main">
        <div class="dashboard-header">
            <h1>👤 Edit Your Profile</h1>
        </div>
        <div class="section-card">
            <form method="POST" action="{{ url_for('alumni.edit_profile') }}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    <div class="form-group">
                        <label>Email (read-only)</label>
                        <input type="email" value="{{ user.email }}" disabled>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Department *</label>
                        <select name="department_id" required>
                            {% for d in departments %}
                            <option value="{{ d.department_id }}" {% if profile and d.department_id == profile.department_id %}selected{% endif %}>{{ d.department_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Graduation Year *</label>
                        <input type="number" name="graduation_year" min="1990" max="2030"
                               value="{{ profile.graduation_year if profile else '' }}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Current Company</label>
                        <input type="text" name="current_company" value="{{ profile.current_company or '' }}" placeholder="e.g. Google">
                    </div>
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" name="job_title" value="{{ profile.job_title or '' }}" placeholder="e.g. Software Engineer">
                    </div>
                </div>
                <div class="form-group">
                    <label>Skills (comma-separated)</label>
                    <input type="text" name="skills" value="{{ profile.skills or '' }}" placeholder="Python, SQL, Machine Learning">
                </div>
                <div class="form-group">
                    <label>LinkedIn URL</label>
                    <input type="url" name="linkedin_url" value="{{ profile.linkedin_url or '' }}" placeholder="https://linkedin.com/in/yourname">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" rows="4" placeholder="Tell students about yourself...">{{ profile.bio or '' }}</textarea>
                </div>
                <button type="submit" class="btn">💾 Save Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
