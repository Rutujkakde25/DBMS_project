{% extends "base.html" %}
{% block title %}Edit Job{% endblock %}
{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar">
        <h3 class="sidebar-title">Alumni Menu</h3>
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('alumni.dashboard') }}">📊 Dashboard</a></li>
            <li><a href="{{ url_for('alumni.edit_profile') }}">👤 Edit Profile</a></li>
            <li><a href="{{ url_for('alumni.my_jobs') }}" class="active">💼 My Jobs</a></li>
            <li><a href="{{ url_for('alumni.add_job') }}">➕ Post a Job</a></li>
            <li><a href="{{ url_for('alumni.mentorship_requests') }}">🤝 Mentorship Requests</a></li>
            <li><a href="{{ url_for('auth.logout') }}" class="logout-link">🚪 Logout</a></li>
        </ul>
    </aside>
    <div class="dashboard-main">
        <div class="dashboard-header">
            <h1>✏️ Edit Job Posting</h1>
        </div>
        <div class="section-card">
            <form method="POST" action="{{ url_for('alumni.edit_job', job_id=job.job_id) }}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" name="company_name" value="{{ job.company_name }}" required>
                    </div>
                    <div class="form-group">
                        <label>Job Title *</label>
                        <input type="text" name="job_title" value="{{ job.job_title }}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Type *</label>
                        <select name="job_type" required>
                            <option value="Internship" {% if job.job_type=='Internship' %}selected{% endif %}>Internship</option>
                            <option value="Full-time" {% if job.job_type=='Full-time' %}selected{% endif %}>Full-time</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" name="location" value="{{ job.location or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Job Description *</label>
                    <textarea name="job_description" rows="5" required>{{ job.job_description }}</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Application Link</label>
                        <input type="url" name="application_link" value="{{ job.application_link or '' }}">
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" name="deadline" value="{{ job.deadline or '' }}">
                    </div>
                </div>
                <button type="submit" class="btn">💾 Update Job</button>
                <a href="{{ url_for('alumni.my_jobs') }}" class="btn btn-outline" style="margin-left:1rem;">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
