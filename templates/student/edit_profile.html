{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar">
        <h3 class="sidebar-title">Student Menu</h3>
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('student.dashboard') }}">📊 Dashboard</a></li>
            <li><a href="{{ url_for('student.edit_profile') }}" class="active">👤 My Profile</a></li>
            <li><a href="{{ url_for('student.search_alumni') }}">🔍 Search Alumni</a></li>
            <li><a href="{{ url_for('student.browse_jobs') }}">💼 Browse Jobs</a></li>
            <li><a href="{{ url_for('student.my_mentorship') }}">🤝 My Requests</a></li>
            <li><a href="{{ url_for('student.browse_events') }}">📅 Events</a></li>
            <li><a href="{{ url_for('auth.logout') }}" class="logout-link">🚪 Logout</a></li>
        </ul>
    </aside>
    <div class="dashboard-main">
        <div class="dashboard-header"><h1>👤 My Profile</h1></div>
        <div class="section-card">
            <form method="POST" action="{{ url_for('student.edit_profile') }}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    <div class="form-group">
                        <label>Email (read-only)</label>
                        <input type="email" value="{{ user.email }}" disabled>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Department *</label>
                        <select name="department_id" required>
                            {% for d in departments %}
                            <option value="{{ d.department_id }}" {% if profile and d.department_id == profile.department_id %}selected{% endif %}>{{ d.department_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Current Year *</label>
                        <select name="current_year" required>
                            {% for y in range(1,6) %}
                            <option value="{{ y }}" {% if profile and profile.current_year == y %}selected{% endif %}>Year {{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Skills (comma-separated)</label>
                    <input type="text" name="skills" value="{{ profile.skills or '' }}" placeholder="Python, C++, Machine Learning">
                </div>
                <div class="form-group">
                    <label>Interests</label>
                    <input type="text" name="interests" value="{{ profile.interests or '' }}" placeholder="AI, Robotics, Entrepreneurship">
                </div>
                <button type="submit" class="btn">💾 Save Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
